spring.application.name=FourthIdInterceptJPA_2005

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/saasant_billing
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Server Configuration
server.port=8084

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.file.name=E:/1 Kousi SaasAnt/Spring Boot Eclipse/Log Folder Date wise/training2005_intercept.log

# Ensure logging pattern includes MDC
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{txId}] %-5level %logger{36} - %msg%n

# Session timeout (optional)
server.servlet.session.timeout=30m
# 30 minutes