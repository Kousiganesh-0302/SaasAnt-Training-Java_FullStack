<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
     <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
    body {
        font-family: Arial;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #e9ecef;
    }


    form {
        width: 100%;
        max-width: 400px;
        background: rgb(255, 128, 255);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgb(255, 0, 255);
    }

    input[type="text"],
    select,
    button {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        box-sizing: border-box;
    }

    button {
        background-color: #4CAF50;
        color: white;
        border: none;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #007BFF; /* Blue hover */
        cursor: pointer;
    }
</style>

</head>
<body>
<div>
	<div>
    <a
      href="ListEmployeeServlet"
      class="btn btn-sm btn-light"
    >View All Employees</a></div>
 <div>
	 
  <form id="empForm" method="post" action="EmployeeServlet0905First" onsubmit="return validateForm()">
    <h2>Employee Details</h2>
    <input type="text" id="empName" name="empName" placeholder="Employee Name" required>
    <input type="text" id="empId"   name="empId"   placeholder="Employee ID" required>
      <span id="idStatus" class="status"></span>
    <select id="position" name="position" required>
      <option value="">-- Select Position --</option>
      <option>Manager</option>
      <option>Developer</option>
      <option>Analyst</option>
    </select>
    <input type="text" id="phone" name="phone" placeholder="Phone Number" required>
      <span id="phoneStatus" class="status"></span>
    <button type="submit">Submit</button>
  </form>
 </div>
  <script>
    // On-blur check for existing Employee ID
    document.getElementById('empId').addEventListener('blur', async e => {
      const id = e.target.value.trim();
      const status = document.getElementById('idStatus');
      const btn = document.querySelector('button[type="submit"]');
      if (!id) { status.textContent = ''; btn.disabled = false; return; }
      try {
        const res = await fetch(`CheckEmpId?empId=${encodeURIComponent(id)}`);
        const json = await res.json();
        if (json.exists) {
          status.textContent = '✖ ID taken'; status.style.color='red';
          btn.disabled = true;
        } else {
          status.textContent = '✔ ID available'; status.style.color='green';
          btn.disabled = false;
        }
      } catch {
        status.textContent = '⚠ Check failed'; status.style.color='orange';
        btn.disabled = false;
      }
    });

    // Simple form-level validation
    function validateForm() {
      const name = document.getElementById('empName').value.trim();
      const id   = document.getElementById('empId').value.trim();
      const pos  = document.getElementById('position').value;
      const ph   = document.getElementById('phone').value.trim();
      if (!/^[A-Za-z ]{2,}$/.test(name)) {
        alert('Enter a valid name.'); return false;
      }
      if (!/^[0-9]+$/.test(id)) {
        alert('Employee ID must be numeric.'); return false;
      }
      if (pos==='' ) {
        alert('Select a position.'); return false;
      }
      if (!/^[0-9]{10}$/.test(ph)) {
        alert('Phone must be 10 digits.'); return false;
      }
      return true;
    }
  </script>
</body>
</html>
